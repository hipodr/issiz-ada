<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f2530">
<title>Ada · Issız Ada</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap">
<style>
:root{--panel:rgba(10,24,32,.72);--line:rgba(255,255,255,.12);--fg:#f6f0e1;--muted:#b4c2bb;--sun:#ff9a3c;--ink:#2b1500;
  --ui:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#0b2a3c;color:var(--fg);font:500 14px/1.3 var(--ui);overflow:hidden;
  user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button,a.btn{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;
  text-decoration:none;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#top{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
#top h1{flex:1;margin:0;font-size:16px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}
#top h1 small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
#timeBox{position:fixed;left:12px;right:12px;top:calc(60px + env(safe-area-inset-top));padding:10px 12px;display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#timeBox input{flex:1;accent-color:var(--sun);height:28px}
#stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.35);
  background:radial-gradient(circle,rgba(255,255,255,.06),rgba(255,255,255,.14));pointer-events:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.75);
  box-shadow:0 2px 8px rgba(0,0,0,.35)}
#stick.run{border-color:var(--sun)} #stick.run #knob{background:var(--sun)}
#hint{position:fixed;left:16px;right:130px;bottom:calc(18px + env(safe-area-inset-bottom));text-align:left;color:var(--fg);opacity:.8;
  font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none;transition:opacity .6s}
#surf{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));font-size:12px;color:var(--muted);text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none}
#tools{position:fixed;left:12px;right:12px;top:calc(60px + env(safe-area-inset-top));display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#tools button{flex:0 0 auto;width:44px;height:44px;padding:5px;border-radius:12px}
#tools button svg{width:100%;height:100%;display:block}
#tools button.on{background:var(--sun);border-color:transparent}
#timeBox{top:calc(112px + env(safe-area-inset-top))!important}
#act{position:fixed;right:18px;bottom:calc(34px + env(safe-area-inset-bottom));width:92px;height:92px;border-radius:50%;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--sun);color:var(--ink);font-weight:800;font-size:13px;
  border:none;box-shadow:0 4px 0 rgba(120,50,0,.55),0 6px 16px rgba(0,0,0,.35);touch-action:none}
#act:active,#act.down{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,50,0,.55),0 3px 10px rgba(0,0,0,.35)}
#act svg{width:34px;height:34px}
#surf{bottom:calc(134px + env(safe-area-inset-bottom))!important}
#busy{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 16px;background:var(--panel);border-radius:14px;display:none}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <a class="btn" href="index.html">← Menü</a>
  <h1>Ada <small id="seedLbl">deneme</small></h1>
  <button type="button" id="timeBtn">Saat 11:00</button>
  <button type="button" id="newBtn">Yeni ada</button>
</div>
<div id="timeBox" hidden><span>Saat</span><input id="tod" type="range" min="0" max="1440" step="10" value="660"><span id="tlbl">11:00</span></div>
<div id="tools"></div>
<button type="button" id="act"><span id="actIco"></span><span id="actLbl">Yumruk</span></button>
<div id="stick"><div id="knob"></div></div>
<div id="hint">Sol tarafta sürükle: yürü (sonuna kadar: koş) · üstten alet seç, turuncu tuş: kullan</div>
<div id="surf"></div>
<div id="busy">Ada oluşuyor…</div>
<div id="err">Bu cihazda WebGL çalışmıyor.</div>
<script type="module" src="js/play/main.js"></script>
</body>
</html>
