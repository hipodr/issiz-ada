<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="theme-color" content="#2a5d78">
<title>Elli Ada — Ada 1 demo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#2a5d78;color:#f6f0e1;font:600 14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#title{position:fixed;left:14px;top:calc(12px + env(safe-area-inset-top));text-shadow:0 1px 4px rgba(0,0,0,.55);pointer-events:none}
#title b{display:block;font-size:17px;letter-spacing:.02em}
#title small{opacity:.85;font-weight:500}
#hint{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;opacity:.85;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none}
#fps{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));font-size:12px;opacity:.8}
#stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:radial-gradient(circle,rgba(255,255,255,.05),rgba(255,255,255,.15));pointer-events:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 2px 8px rgba(0,0,0,.35)}
#stick.run{border-color:#ffb347} #stick.run #knob{background:#ffb347}
#grid{position:fixed;right:12px;top:calc(34px + env(safe-area-inset-top));padding:8px 12px;border:0;border-radius:12px;background:rgba(10,24,32,.6);color:#f6f0e1;font:inherit}
#grid.off{opacity:.55}
#busy{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 18px;border-radius:14px;background:rgba(10,24,32,.75)}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="title"><b>Elli Ada</b><small>Ada 1 · demo</small></div>
<div id="fps"></div>
<div id="stick"><div id="knob"></div></div>
<div id="hint">Ekranın sol tarafına dokunup sürükle: yürü · sonuna kadar it: koş · iki parmak: yakınlaştır</div>
<button id="grid">⬡ Altıgen</button>
<div id="busy">Ada yükleniyor…</div>
<script type="module" src="js/main.js?v=12"></script>
</body>
</html>
