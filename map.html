<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f2530">
<title>Harita · Issız Ada</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap">
<style>
:root{--panel:rgba(10,24,32,.74);--line:rgba(255,255,255,.12);--fg:#f6f0e1;--muted:#b4c2bb;--sun:#ff9a3c;--ink:#2b1500;
  --ui:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0b2a3c;color:var(--fg);font:500 14px/1.3 var(--ui);overflow:hidden;
  user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
button,a.btn{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;
  text-decoration:none;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
button.pri{background:var(--sun);color:var(--ink);font-weight:800;border-color:transparent}
#top{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center}
#top h1{flex:1;margin:0;font-size:17px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.5)}
#top h1 small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
#bottom{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#jump{display:flex;gap:8px;flex-wrap:wrap}
#time{padding:10px 12px;display:flex;align-items:center;gap:10px}
#time input{flex:1;accent-color:var(--sun);height:28px}
#tlbl{min-width:84px;text-align:right;font-weight:700}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;color:var(--muted)}
#busy{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 16px;display:none}
#fps{position:fixed;right:12px;top:calc(60px + env(safe-area-inset-top));font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <a class="btn" href="ada.html" aria-label="Karakterle gez">← Ada</a>
  <h1>Harita<small id="seedLbl"></small></h1>
  <button class="pri" id="newBtn" type="button">Yeni ada</button>
</div>
<div id="fps" hidden></div>
<div id="busy" class="card">Ada oluşuyor…</div>
<div id="bottom">
  <div id="jump">
    <button type="button" id="fitBtn">Tüm ada</button>
    <button type="button" id="caveBtn">Mağara</button>
    <button type="button" id="riverBtn">Dere ağzı</button>
    <button type="button" id="beachBtn">Sahil</button>
  </div>
  <div id="time" class="card">
    <span>Saat</span><input id="tod" type="range" min="0" max="1440" step="10" value="660"><span id="tlbl"></span>
  </div>
</div>
<div id="err">Bu cihazda WebGL çalışmıyor, harita çizilemedi.</div>
<script type="module" src="js/map/viewer.js"></script>
</body>
</html>
